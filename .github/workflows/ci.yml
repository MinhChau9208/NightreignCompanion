name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend goes first: main.go embeds frontend/dist, which only
      # exists after a build, so `go vet`/`go test` would fail without it.
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend type-check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Validate data pack
        run: go run ./cmd/nrc-cli validate

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Build
        run: wails build -clean -ldflags "-X main.version=0.1.0-${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nightreign-companion-windows
          path: build/bin/*.exe
